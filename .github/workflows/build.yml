name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest   # x86_64 runner，可正常执行 R8 混淆
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17（AGP 9.3 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 校验 Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: 还原签名密钥（从 Secret base64 解码）
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > release.keystore
            echo "✅ 签名密钥已还原到 release.keystore"
          else
            echo "⚠️ 未配置 RELEASE_KEYSTORE Secret，将使用默认路径（可能失败）"
          fi

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Release（混淆 + 资源压缩）
        env:
          # 相对 app/ 目录，指向项目根目录的 keystore（与 build.gradle.kts 默认 ../release.keystore 一致）
          KEYSTORE_PATH: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: AnySearch-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
